<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 — Shawn Austin Rocks</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/glitch.css">
    <style>
        .error-section {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 40px 20px;
            box-sizing: border-box;
        }
        .error-img {
            max-width: 400px;
            width: 80%;
            height: auto;
            border: 2px solid var(--accent);
            box-shadow: 0 0 30px var(--accent);
            margin-bottom: 30px;
            filter: contrast(1.1);
        }
        .error-msg {
            font-size: 1.3rem;
            letter-spacing: 2px;
            color: var(--accent-secondary);
            text-transform: uppercase;
            margin-bottom: 30px;
        }
    </style>
</head>
<body>
    <div class="scanlines"></div>

    <section class="error-section">
        <h1 class="glitch" data-text="404">404</h1>
        <img class="error-img" src="/Girl-Vomit.jpg" alt="That page made me sick">
        <p class="error-msg">This page doesn't exist. Gross.</p>
        <a href="/" class="glitch-btn">BACK TO SHAWN</a>
    </section>
</body>
</html>
